services:
  nginx:
    container_name: glucoguide-nginx
    image: nginx:1.27-bookworm
    ports:
      - "8000:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend
      - frontend

  frontend:
    container_name: glucoguide-frontend
    build: ./frontend
    ports:
      - "3000:3000"
    command: "yarn dev"
    volumes:
      - "./frontend:/app"

  backend:
    container_name: glucoguide-backend
    build: ./backend
    ports:
      - "8001:3001"
    depends_on:
      - postgres
      - redis
    command: "npm run dev"
    volumes:
      - "./backend:/code"

  bullmq-worker:
    container_name: glucoguide-bullmq-worker
    build: ./backend
    command: "npm run worker:all"
    depends_on:
      - redis
      - backend
    volumes:
      - "./backend:/code"

  postgres:
    container_name: glucoguide-db
    image: postgres:13
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASS:-postgres}
      POSTGRES_DB: ${POSTGRES_DATABASE_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: glucoguide-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/var/lib/redis/data

  pgadmin:
    container_name: glucoguide-pgadmin
    image: dpage/pgadmin4
    ports:
      - "8080:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASS}
    depends_on:
      - postgres
      - nginx
    volumes:
      - pgadmin_data:/var/lib/pgadmin

  redis_insight:
    image: redislabs/redisinsight:latest
    container_name: glucoguide-redis-insight
    ports:
      - "5540:5540"
    depends_on:
      - redis
      - nginx
    volumes:
      - redis_insight_data:/var/lib/redis-insight/data

volumes:
  postgres_data:
  pgadmin_data:
  redis_data:
  redis_insight_data:
